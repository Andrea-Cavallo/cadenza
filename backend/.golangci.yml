version: "2"

run:
  go: "1.25.9"
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
  settings:
    gocritic:
      enabled-checks:
        - dupImport
        - nestingReduce
        - unnamedResult
    misspell:
      locale: US
  exclusions:
    paths:
      - docs
      - .idea
      - .tokensave
    rules:
      - path: internal/session/
        linters:
          - misspell

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
