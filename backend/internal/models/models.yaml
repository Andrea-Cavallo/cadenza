# Cadenza model catalog
# Edit this file to add/remove models without recompiling.
# A local override at ~/.cadenza/models.yaml or ./models.yaml takes precedence over this embedded default.

providers:
  claude:
    default: claude-opus-4-7
    models:
      - id: claude-opus-4-7
        name: "Claude Opus 4.7   — deepest musical reasoning"
      - id: claude-sonnet-4-6
        name: "Claude Sonnet 4.6 — best coding/JSON balance"
      - id: claude-haiku-4-5-20251001
        name: "Claude Haiku 4.5  — fast & cost-effective"

  ollama:
    default: qwen2.5:7b
    models:
      - id: qwen2.5:7b
        name: "Qwen 2.5 7B      — best structured JSON on 8 GB VRAM"
      - id: qwen2.5:14b
        name: "Qwen 2.5 14B     — higher quality, needs 12 GB VRAM"
      - id: qwen2.5:32b
        name: "Qwen 2.5 32B     — near-GPT4 quality, needs 24 GB VRAM"
      - id: llama3.2:3b
        name: "Llama 3.2 3B     — lightest/fastest, 4 GB VRAM"
      - id: llama3.1:8b
        name: "Llama 3.1 8B     — solid Meta baseline, 8 GB VRAM"
      - id: llama3.3:70b
        name: "Llama 3.3 70B    — very powerful, needs 40+ GB VRAM"
      - id: mistral:7b
        name: "Mistral 7B       — reliable instruction following, 8 GB VRAM"
      - id: mixtral:8x7b
        name: "Mixtral 8x7B     — MoE, great speed/quality ratio, 26 GB VRAM"
      - id: gemma2:9b
        name: "Gemma 2 9B       — Google, good JSON discipline, 10 GB VRAM"
      - id: phi4:14b
        name: "Phi-4 14B        — Microsoft, strong structured reasoning, 12 GB VRAM"
      - id: deepseek-r1:7b
        name: "DeepSeek-R1 7B   — chain-of-thought reasoning, 8 GB VRAM"
      - id: qwen2.5-coder:7b
        name: "Qwen 2.5 Coder 7B— optimised for JSON/code output, 8 GB VRAM"

  openai:
    default: gpt-4o
    models:
      - id: gpt-4o
        name: "GPT-4o      — flagship multimodal"
      - id: gpt-4o-mini
        name: "GPT-4o Mini — fast & cheap"
      - id: gpt-4-turbo
        name: "GPT-4 Turbo — 128k context"
      - id: o3-mini
        name: "o3-mini     — reasoning model"

  gemini:
    default: gemini-2.0-flash-exp
    models:
      - id: gemini-2.0-flash-exp
        name: "Gemini 2.0 Flash  — fast JSON generation"
      - id: gemini-1.5-pro
        name: "Gemini 1.5 Pro    — 1M context window"
      - id: gemini-1.5-flash
        name: "Gemini 1.5 Flash  — cost-effective"

  deepseek:
    default: deepseek-chat
    models:
      - id: deepseek-chat
        name: "DeepSeek-V3        — flagship, best music/JSON"
      - id: deepseek-reasoner
        name: "DeepSeek-R1        — chain-of-thought reasoning"

  groq:
    default: llama-3.3-70b-versatile
    models:
      - id: llama-3.3-70b-versatile
        name: "Llama 3.3 70B     — ultra-fast LPU inference"
      - id: mixtral-8x7b-32768
        name: "Mixtral 8x7B      — MoE, 32k context"
      - id: deepseek-r1-distill-llama-70b
        name: "DeepSeek-R1 Llama — chain-of-thought on LPU"

  mistral:
    default: mistral-large-latest
    models:
      - id: mistral-large-latest
        name: "Mistral Large     — flagship European model"
      - id: mistral-medium-latest
        name: "Mistral Medium    — balanced quality/speed"
      - id: codestral-latest
        name: "Codestral         — code & structured JSON"
