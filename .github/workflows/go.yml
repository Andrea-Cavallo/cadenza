name: Go Build

# Lightweight sanity build on every push.
# Full quality pipeline (lint, security, sonar) runs in ci.yml.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -v ./...
