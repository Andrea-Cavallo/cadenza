name: Go Build

# Lightweight sanity build — runs on every push to every branch.
# Full test suite, lint, and SonarCloud run in ci.yml.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -v ./...

      - name: Test
        run: go test -v ./...
