name: Desktop Packages

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            script: powershell
            artifact: cadenza-desktop-windows
            zip: dist/*windows-amd64.zip
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            script: bash
            artifact: cadenza-desktop-macos
            zip: dist/*macos-universal.zip
          - name: Linux
            os: ubuntu-22.04
            platform: linux/amd64
            script: bash
            artifact: cadenza-desktop-linux
            zip: dist/*linux-amd64.zip

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/cmd/desktop/frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop distribution (Windows)
        if: matrix.script == 'powershell'
        shell: pwsh
        run: ./scripts/build-distributions.ps1 -Version "${{ github.sha }}" -DesktopPlatforms "${{ matrix.platform }}" -SkipChecks

      - name: Build desktop distribution (Unix)
        if: matrix.script == 'bash'
        shell: bash
        run: bash scripts/build-distributions.sh --version "${{ github.sha }}" --desktop-platforms "${{ matrix.platform }}" --skip-checks

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find dist/_stage/macos/desktop -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in dist/_stage/macos/desktop — skipping DMG"
            exit 0
          fi
          echo "Creating DMG from: $APP_PATH"
          hdiutil create \
            -volname "Cadenza" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "dist/cadenza-desktop-macos.dmg"
          echo "DMG created: dist/cadenza-desktop-macos.dmg"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: cadenza-desktop-macos-dmg
          path: dist/cadenza-desktop-macos.dmg
          if-no-files-found: warn

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
