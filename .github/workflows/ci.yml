name: CI

on:
  push:
    branches: [master, main, develop, "feature/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # 1. Test + Coverage
  # ────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Coverage gate (fail if < 80%)
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 80" | bc -l)" -eq 1 ]; then
            echo "FAIL: Coverage ${total}% is below 80% threshold"
            exit 1
          fi

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

      - name: Cross-compile check (linux/amd64)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  # ────────────────────────────────────────────
  # 2. Lint
  #
  # Uses `go install` instead of golangci-lint-action's
  # pre-built binary. The pre-built binary is compiled with
  # a fixed Go version; when .golangci.yml targets go 1.26
  # it refuses to start with:
  #   "can't load config: Go language version used to build
  #    golangci-lint is lower than the targeted Go version"
  # Installing from source uses the project's own toolchain.
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run ./...

  # ────────────────────────────────────────────
  # 3. Security — vulnerability scan
  # ────────────────────────────────────────────
  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ────────────────────────────────────────────
  # 4. SonarCloud
  #
  # SHA pinning: version tags (@v4/@v3) are left intentionally.
  # Dependabot (.github/dependabot.yml) opens weekly PRs that
  # replace them with full commit SHAs, satisfying the OSSF
  # Scorecard "Pinned-Dependencies" check automatically.
  # ────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ────────────────────────────────────────────
  # 5. Docker smoke test
  # ────────────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cadenza:ci .

      - name: Smoke test (must produce 3 MIDI files)
        run: |
          mkdir -p output
          docker run --rm -v "$(pwd)/output:/app/output" cadenza:ci \
            --bpm 122 --key Am --no-llm
          count=$(ls output/*.mid 2>/dev/null | wc -l)
          [ "$count" -eq 3 ] || (echo "Expected 3 MIDI files, got $count" && exit 1)
          echo "Smoke test passed: $count MIDI files"
