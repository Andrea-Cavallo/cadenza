name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build -o /dev/null ./cmd/cadenza/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cadenza:test .

      - name: Test Docker image (offline mode)
        run: |
          mkdir -p output
          docker run --rm -v $(pwd)/output:/app/output cadenza:test \
            --bpm 122 --key Am --no-llm
          count=$(ls output/*.mid 2>/dev/null | wc -l)
          [ "$count" -eq 3 ] || (echo "Expected 3 MIDI files, got $count" && exit 1)
