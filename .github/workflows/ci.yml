name: CI

on:
  push:
    branches: [master, main, develop, feature/**]
  pull_request:
    branches: [master, main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Coverage
  # ──────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required by SonarCloud

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

      - name: Cross-compile check (linux)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

      # Upload coverage for SonarCloud job
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  # ──────────────────────────────────────────────
  # 2. Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ──────────────────────────────────────────────
  # 3. Security — vulnerability scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # 4. SonarCloud analysis
  # ──────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for blame annotations

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────
  # 5. Docker image — only after test + lint pass
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cadenza:ci .

      - name: Smoke test (offline mode — must produce 3 MIDI files)
        run: |
          mkdir -p output
          docker run --rm -v $(pwd)/output:/app/output cadenza:ci \
            --bpm 122 --key Am --no-llm
          count=$(ls output/*.mid 2>/dev/null | wc -l)
          [ "$count" -eq 3 ] || (echo "Expected 3 MIDI files, got $count" && exit 1)
          echo "Docker smoke test passed: $count MIDI files generated"
