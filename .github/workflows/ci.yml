name: CI

on:
  push:
    branches: [master, main, develop, "feature/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # 1. Build
  # ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

      - name: Cross-compile check (linux/amd64)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/cadenza/

  # ────────────────────────────────────────────
  # 2. Lint
  #
  # Uses `go install` instead of golangci-lint-action's
  # pre-built binary. The pre-built binary is compiled with
  # a fixed Go version; when .golangci.yml targets go 1.26
  # it refuses to start with:
  #   "can't load config: Go language version used to build
  #    golangci-lint is lower than the targeted Go version"
  # Installing from source uses the project's own toolchain.
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint

      - name: Run golangci-lint
        run: golangci-lint run ./...

  # ────────────────────────────────────────────
  # 3. Security — vulnerability scan
  # ────────────────────────────────────────────
  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: govulncheck ./...

  # ────────────────────────────────────────────
  # 4. SonarCloud
  #
  # SHA pinning: version tags (@v4/@v3) are left intentionally.
  # Dependabot (.github/dependabot.yml) opens weekly PRs that
  # replace them with full commit SHAs, satisfying the OSSF
  # Scorecard "Pinned-Dependencies" check automatically.
  # ────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ────────────────────────────────────────────
  # 5. Docker smoke test
  # ────────────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t cadenza:ci backend/

      - name: Smoke test (must produce 3 MIDI files)
        run: |
            mkdir -p output
            chmod 755 output
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$(pwd)/output:/app/output" cadenza:ci \
              --bpm 122 --key Am --no-llm
            count=$(ls output/*.mid 2>/dev/null | wc -l)
            [ "$count" -eq 3 ] || (echo "Expected 3 MIDI files, got $count" && exit 1)
            echo "Smoke test passed: $count MIDI files"
