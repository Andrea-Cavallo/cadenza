<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadenza — MIDI generation for modern electronic music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-1: #0a0a0a;
    --bg-2: #111111;
    --line: #1a1a1a;
    --line-2: #262626;
    --fg: #ffffff;
    --fg-dim: #a3a3a3;
    --fg-muted: #5c5c5c;
    --accent: #01FF95;            /* beatport acid lime */
    --accent-ink: #001b10;
    --danger: oklch(0.66 0.19 25);
    --grid-rgb: 255 255 255;

    --sans: "Inter Tight", -apple-system, "Helvetica Neue", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif: "Fraunces", "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-feature-settings: "ss01", "ss02", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(var(--grid-rgb) / 0.04), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(var(--grid-rgb) / 0.03), transparent 60%);
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  a { color: inherit; text-decoration: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

  .mono { font-family: var(--mono); font-feature-settings: "ss02", "zero"; }
  .serif { font-family: var(--serif); font-style: italic; font-weight: 300; }

  /* ── shared layout ───────────────────────────────────────── */
  .shell {
    max-width: 1480px;
    margin: 0 auto;
    padding: 0 40px;
  }
  .row {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .cell {
    background: var(--bg);
    padding: 28px 32px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-muted);
    font-weight: 500;
  }
  .label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* ── topbar ──────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    z-index: 50;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border: 1px solid var(--fg);
    display: grid; place-items: center;
    font-size: 11px;
    font-weight: 700;
  }
  .pill {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 9px;
    border: 1px solid var(--line-2);
    color: var(--fg-dim);
    border-radius: 999px;
  }
  .pill.live {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .pill.live::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 7px;
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .topnav {
    display: flex; gap: 26px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--fg-dim);
  }
  .topnav a:hover { color: var(--fg); }

  /* ── buttons ─────────────────────────────────────────────── */
  .btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.1); background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border-color: var(--line-2); color: var(--fg-dim); }
  .btn.ghost:hover { color: var(--fg); border-color: var(--fg); background: transparent; }

  /* ── inputs ──────────────────────────────────────────────── */
  input[type="text"], input[type="number"], select {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg-1);
    color: var(--fg);
    border: 1px solid var(--line-2);
    padding: 10px 12px;
    width: 100%;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--fg-dim) 50%),
      linear-gradient(135deg, var(--fg-dim) 50%, transparent 50%);
    background-position:
      calc(100% - 16px) 50%,
      calc(100% - 11px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
  }
  input[type="text"], input[type="number"] { background-image: none; padding-right: 12px; }
  input:focus, select:focus { border-color: var(--accent); }
  /* dropdown options — force readable bg/fg in both themes */
  select option {
    background: var(--bg-1);
    color: var(--fg);
  }
  input[type="range"] { accent-color: var(--accent); width: 100%; }

  /* ── piano roll ──────────────────────────────────────────── */
  .roll-wrap {
    position: relative;
    height: 420px;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    overflow: hidden;
    background:
      linear-gradient(180deg, transparent 0%, transparent 92%, var(--bg) 100%);
  }
  .roll-svg { width: 100%; height: 100%; display: block; }
  .roll-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    padding: 28px 32px;
  }
  .roll-overlay .meta {
    display: flex; gap: 28px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .roll-overlay .meta .v { color: var(--fg); font-weight: 600; }

  /* ── hero typography ─────────────────────────────────────── */
  .hero-title {
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(56px, 9vw, 144px);
    line-height: 0.92;
    letter-spacing: -0.04em;
    margin: 0;
  }
  .hero-title em {
    font-style: normal;
    font-weight: 500;
    color: var(--accent);
  }

  /* ── tables / data ───────────────────────────────────────── */
  .kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 6px 24px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .kv .k { color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; }
  .kv .v { color: var(--fg); }

  /* ── code block ──────────────────────────────────────────── */
  .code {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 18px 20px;
    overflow-x: auto;
    white-space: pre;
  }
  .code .c-comment { color: var(--fg-muted); }
  .code .c-flag    { color: var(--accent); }
  .code .c-str     { color: var(--fg-dim); }
  .code .c-key     { color: var(--accent); }
  .code .c-num     { color: var(--fg); }
  .code .c-punct   { color: var(--fg-muted); }

  /* ── preset cards ────────────────────────────────────────── */
  .preset {
    background: var(--bg);
    padding: 24px 28px;
    cursor: pointer;
    transition: background .15s ease;
    position: relative;
    min-height: 220px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .preset:hover { background: var(--bg-1); }
  .preset.on { background: var(--bg-2); }
  .preset.on::after {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent);
  }
  .preset .num {
    font-family: var(--mono); font-size: 10.5px; color: var(--fg-muted); letter-spacing: 0.18em;
  }
  .preset h3 {
    font-family: var(--sans); font-weight: 400;
    font-size: 24px; letter-spacing: -0.02em;
    margin: 12px 0 10px; line-height: 1.05;
  }
  .preset h3 em { font-style: normal; color: var(--accent); font-weight: 500; }
  .preset p {
    font-size: 13.5px; color: var(--fg-dim); line-height: 1.5;
    margin: 0; max-width: 36ch;
  }
  .preset .params {
    display: flex; gap: 14px; margin-top: 22px;
    font-family: var(--mono); font-size: 11px; color: var(--fg-muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .preset .params span strong { color: var(--fg); font-weight: 500; }

  /* ── tabs ────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 14px 22px;
    color: var(--fg-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .15s ease;
  }
  .tab:hover { color: var(--fg-dim); }
  .tab.on { color: var(--fg); border-bottom-color: var(--accent); }

  /* ── method badge ────────────────────────────────────────── */
  .method {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    padding: 3px 8px;
    border: 1px solid currentColor;
    text-transform: uppercase;
  }
  .method.get  { color: oklch(0.7 0.13 165); }
  .method.post { color: var(--accent); }
  .method.put  { color: oklch(0.72 0.12 250); }

  /* ── pipeline ────────────────────────────────────────────── */
  .pipe-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .pipe-step {
    background: var(--bg);
    padding: 28px 26px;
    position: relative;
    min-height: 180px;
  }
  .pipe-step .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-muted);
    letter-spacing: 0.18em;
  }
  .pipe-step h4 {
    font-family: var(--sans); font-weight: 500;
    font-size: 19px; letter-spacing: -0.01em;
    margin: 10px 0 8px;
  }
  .pipe-step p {
    font-size: 13px; color: var(--fg-dim);
    margin: 0; line-height: 1.5;
  }
  .pipe-step .glyph {
    margin-top: 22px;
    height: 38px;
    color: var(--fg-muted);
    font-family: var(--mono);
    font-size: 11px;
    display: flex; align-items: center;
  }
  .pipe-step:not(:last-child)::after {
    content: "→";
    position: absolute;
    right: -12px; top: 50%;
    transform: translateY(-50%);
    background: var(--bg);
    color: var(--accent);
    width: 24px; height: 24px;
    display: grid; place-items: center;
    z-index: 2;
    font-family: var(--mono);
  }

  /* ── footer ──────────────────────────────────────────────── */
  footer {
    margin-top: 80px;
    border-top: 1px solid var(--line);
    padding: 60px 40px 40px;
  }
  .foot-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 60px;
    max-width: 1480px; margin: 0 auto;
  }
  .foot-grid h5 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-muted);
    font-weight: 500;
    margin: 0 0 16px;
  }
  .foot-grid li {
    list-style: none;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--fg-dim);
    margin-bottom: 8px;
  }
  .foot-grid ul { padding: 0; margin: 0; }
  .foot-grid a:hover { color: var(--accent); }

  /* ── sections spacing ─────────────────────────────────────── */
  section { padding: 90px 0; }
  section.tight { padding: 50px 0; }
  .section-head {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 60px;
    margin-bottom: 40px;
  }
  .section-head h2 {
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(32px, 4vw, 56px);
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .section-head h2 em { font-style: normal; color: var(--accent); font-weight: 500; }
  .section-head p {
    font-size: 16px; color: var(--fg-dim); line-height: 1.55;
    max-width: 60ch;
    margin: 0;
  }

  /* ── theme toggle ─────────────────────────────────────────── */
  .theme-toggle {
    display: inline-flex;
    border: 1px solid var(--line-2);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .theme-toggle button {
    background: transparent;
    border: 0;
    color: var(--fg-muted);
    padding: 8px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
  }
  .theme-toggle button.on { background: var(--fg); color: var(--bg); }

  /* ── responsive guard ─────────────────────────────────────── */
  @media (max-width: 1280px) {
    .shell { padding: 0 28px; }
    .topbar { padding: 16px 28px; }
    .topnav { gap: 18px; font-size: 11.5px; }
    .topbar .pill { display: none; }
    .topbar .pill.live { display: inline-block; }
  }
  @media (max-width: 1100px) {
    .topnav { display: none; }
    .row[style*="repeat(4"] { grid-template-columns: repeat(2, 1fr) !important; }
    .pipe-row { grid-template-columns: repeat(2, 1fr); }
    .pipe-step:not(:last-child)::after { display: none; }
    .row[style*="1.1fr 1.4fr"],
    .row[style*="1fr 1.4fr"] { grid-template-columns: 1fr !important; }
    .section-head { grid-template-columns: 1fr; gap: 16px; }
    .foot-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
    .hero-title { font-size: clamp(48px, 8vw, 96px) !important; }
  }
  @media (max-width: 720px) {
    .shell { padding: 0 18px; }
    .topbar { padding: 12px 18px; }
    .row[style*="repeat(4"] { grid-template-columns: 1fr !important; }
    .pipe-row { grid-template-columns: 1fr; }
    .foot-grid { grid-template-columns: 1fr; gap: 32px; }
    .topbar .btn.ghost { display: none; }
    .topbar .brand .pill { display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="pianoroll.jsx"></script>
  <script type="text/babel" src="presets.jsx"></script>
  <script type="text/babel" src="console.jsx"></script>
  <script type="text/babel" src="pipeline.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
