run:
  timeout: 3m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gocritic
    - misspell
    - gofmt
    - goimports

linters-settings:
  gocritic:
    enabled-checks:
      - dupImport
      - nestingReduce
      - unnamedResult
  misspell:
    locale: US

issues:
  exclude-dirs:
    - docs
    - .idea
    - .tokensave
  max-issues-per-linter: 50
  max-same-issues: 3
