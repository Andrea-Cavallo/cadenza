sonar.projectKey=Andrea-Cavallo_cadenza
sonar.organization=andrea-cavallo
sonar.projectName=Cadenza
sonar.projectVersion=1.0

# Sources — test files are registered separately via sonar.tests, not excluded
sonar.sources=.
sonar.exclusions=**/vendor/**,docs/**,bin/**,dist/**,output/**,prompts/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage — generated by: go test ./... -coverprofile=coverage.out -covermode=atomic
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
sonar.language=go

# Links
sonar.links.homepage=https://github.com/Andrea-Cavallo/cadenza
sonar.links.ci=https://github.com/Andrea-Cavallo/cadenza/actions
sonar.links.scm=https://github.com/Andrea-Cavallo/cadenza
sonar.links.issue=https://github.com/Andrea-Cavallo/cadenza/issues

# Quality gate thresholds (documented, enforced on SonarCloud UI)
# Coverage: >= 80%
# Duplications: <= 3%
# Maintainability rating: A
# Reliability rating: A
# Security rating: A
